<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e100d"><title>sSheila</title>
  <link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span><div><strong>sSheila</strong><small>Personal utility</small></div></div>
    <nav aria-label="Item filters">
      <button class="nav-item active" data-filter="all"><span>Everything</span><b id="all-count">0</b></button>
      <button class="nav-item" data-filter="file"><span>Files</span><b id="file-count">0</b></button>
      <button class="nav-item" data-filter="note"><span>Notes</span><b id="note-count">0</b></button>
    </nav>
    <div class="sidebar-foot"><span id="connection" class="connection">Connecting</span><small>Private host network</small></div>
  </aside>
  <main>
    <header class="topbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search files and notes" autocomplete="off"></label>
      <div class="actions"><span id="storage" class="storage">Checking storage…</span><button id="new-note" class="button secondary">New note</button><button id="send-file" class="button primary">Send file</button></div>
    </header>
    <section class="content">
      <div class="heading"><div><p class="eyebrow">UNIVERSAL INBOX</p><h1 id="view-title">Everything</h1><p id="view-description">Files and thoughts from every device, in one place.</p></div><span id="item-summary" class="item-summary">0 items</span></div>
      <label id="drop-zone" class="drop-zone"><input id="file-input" type="file" multiple hidden><span class="drop-icon">↑</span><span><strong>Drop files here</strong><small>or choose files from this device</small></span><span id="upload-progress" class="upload-progress"></span></label>
      <section id="items" class="items" aria-live="polite"><div class="loading">Loading your host…</div></section>
    </section>
  </main>
</div>
<dialog id="note-dialog">
  <form id="note-form">
    <div class="dialog-head"><div><p class="eyebrow">SHEILA NOTE</p><h2 id="note-dialog-title">New note</h2></div><button id="close-note" class="icon-button" type="button" aria-label="Close">×</button></div>
    <input id="note-title" class="note-title" type="text" placeholder="Note title" maxlength="180">
    <textarea id="note-content" placeholder="Start writing…" required></textarea>
    <div class="dialog-actions"><span>Stored on this host</span><button class="button primary" type="submit">Save note</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status"></div><script src="/app.js" defer></script>
</body>
</html>
