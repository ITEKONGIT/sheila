name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Create release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Generate main-only release version
        id: release
        shell: bash
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "The release workflow is main-push-only." >&2
            exit 1
          fi
          project_version=$(sed -nE 's/^project\(sSheila VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a three-part project version from CMakeLists.txt." >&2
            exit 1
          fi
          IFS=. read -r major minor _patch <<< "$project_version"
          version="${major}.${minor}.${RELEASE_RUN_NUMBER}"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg

    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MinGW UCRT
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Bootstrap vcpkg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DVCPKG_TARGET_TRIPLET=x64-mingw-static
          -DVCPKG_HOST_TRIPLET=x64-mingw-static
          "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE/vcpkg-overlays"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/release/ssheila.exe "release/ssheila-$env:RELEASE_TAG-windows-x64.exe"

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_root="release/ssheila-linux-x64"
          mkdir -p "$package_root"
          install -m 0755 build/release/ssheila "$package_root/ssheila"
          install -m 0644 packaging/linux/ssheila.service "$package_root/ssheila.service"
          install -m 0644 packaging/linux/ssheila.default "$package_root/ssheila.default"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "release/ssheila-$RELEASE_TAG-linux-x64.tar.gz" \
            -C release ssheila-linux-x64
          rm -rf "$package_root"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign release artifacts
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release/* | sort -k2 > release/SHA256SUMS

      - name: Sign release artifacts with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          for file in release/*; do
            case "$file" in
              *.sig|*.pem) continue ;;
            esac
            cosign sign-blob "$file" \
              --yes \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem"
          done

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: [metadata, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release

      - name: Create or update GitHub Release
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sSheila $RELEASE_TAG" \
              --generate-notes
          fi

  r2-release:
    name: Publish latest release to R2
    needs: [metadata, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download signed release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release

      - name: Explain skipped R2 publish
        if: env.R2_ACCOUNT_ID == '' || env.R2_ACCESS_KEY_ID == '' || env.R2_SECRET_ACCESS_KEY == '' || env.R2_BUCKET == '' || env.R2_PUBLIC_BASE_URL == ''
        run: |
          echo "::warning::R2 publishing skipped. Configure CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, and R2_PUBLIC_BASE_URL to enable it."

      - name: Install Cosign
        if: env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' && env.R2_PUBLIC_BASE_URL != ''
        uses: sigstore/cosign-installer@v3.7.0

      - name: Generate signed latest manifest
        if: env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' && env.R2_PUBLIC_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-release-manifest.py \
            --release-dir release \
            --tag "$RELEASE_TAG" \
            --base-url "$R2_PUBLIC_BASE_URL" \
            --github-release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG" \
            --output release/latest.json
          windows="release/ssheila-${RELEASE_TAG}-windows-x64.exe"
          linux="release/ssheila-${RELEASE_TAG}-linux-x64.tar.gz"
          {
            printf '%s  %s\n' "$(sha256sum "$windows" | cut -d ' ' -f 1)" "sSheila.exe"
            printf '%s  %s\n' "$(sha256sum "$linux" | cut -d ' ' -f 1)" "sSheila.tar.gz"
          } > release/latest.SHA256SUMS
          cosign sign-blob release/latest.SHA256SUMS \
            --yes \
            --output-signature release/latest.SHA256SUMS.sig \
            --output-certificate release/latest.SHA256SUMS.pem
          cosign sign-blob release/latest.json \
            --yes \
            --output-signature release/latest.json.sig \
            --output-certificate release/latest.json.pem

      - name: Publish versioned and latest R2 objects
        if: env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' && env.R2_PUBLIC_BASE_URL != ''
        shell: bash
        run: bash scripts/publish-r2.sh release "$RELEASE_TAG"

  pages-release:
    name: Deploy release site to Cloudflare Pages
    needs: [github-release, r2-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out release site
        uses: actions/checkout@v4
        with:
          repository: ITEKONGIT/sheila-frontend
          ref: main
          path: sheila-frontend
          fetch-depth: 1

      - name: Explain skipped Pages deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::Pages deployment skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."

      - name: Deploy release site
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: sheila-frontend
        shell: bash
        run: |
          set -euo pipefail
          frontend_sha=$(git rev-parse HEAD)
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name ssheila \
            --branch main \
            --commit-hash "$frontend_sha" \
            --commit-message "Release gateway for $GITHUB_SHA"
